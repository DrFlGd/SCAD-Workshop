# SPDX-License-Identifier: MIT
[package]
name = "mitcad-zip"
description = "Minimal zip reader and writer for the .f3d and .FCStd containers"
version = "0.0.0"
edition = "2024"
license = "MIT"

[lib]
name = "mitcad_zip"

[dependencies]
# Pure-Rust decompressors (deflate and zstd); deflate also compresses.
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
