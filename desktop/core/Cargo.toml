[package]
name = "workshop-core"
description = "Native rendering, cache, workspace and storage for the SCAD Workshop desktop app"
version.workspace = true
edition.workspace = true

[lib]
name = "workshop_core"

[[bin]]
name = "workshop-cli"
path = "src/bin/workshop-cli.rs"

[dependencies]
anyhow = "1"
flate2 = "1"
hex = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "fs"] }
toml = { version = "0.8", features = ["preserve_order"] }
ureq = { version = "2", features = ["proxy-from-env"] }
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
# MitCad's .f3d reader (desktop/core/mitcad/, pinned and patched by tools/fetch_mitcad.py; 0.4.27)
mitcad-f3d-design = { path = "mitcad/f3d-design" }
mitcad-f3d-file = { path = "mitcad/f3d-file" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
