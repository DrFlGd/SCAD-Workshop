<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SCAD Workshop</title>
  <meta name="description" content="Generate printable Gridfinity, openGrid and wall-storage parts from open-source OpenSCAD models.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Overpass:wght@400..800&family=Overpass+Mono:wght@400..700&family=Sofia+Sans:wght@400..800&family=Sofia+Sans+Condensed:wght@400..700&family=Sofia+Sans+Extra+Condensed:wght@600..800&family=Atkinson+Hyperlegible:wght@400;700&family=M+PLUS+Rounded+1c:wght@800&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg class="brand-mark" viewBox="0 0 256 256" aria-hidden="true"><path class="page" d="M58 26 H170 L222 78 V206 Q222 230 198 230 H58 Q34 230 34 206 V50 Q34 26 58 26 Z"/><path class="fold" d="M170 26 V58 Q170 78 190 78 H222 Z"/><g transform="translate(126 138) scale(1.24) translate(-126 -136)"><path class="face" d="M126 135 L176 106 L176 167 L126 196 Z"/><path class="cube" d="M126 77 L176 106 L176 167 L126 196 L76 167 L76 106 Z M76 106 L126 135 L176 106 M126 135 L126 196"/></g><path class="edge" d="M58 26 H170 L222 78 V206 Q222 230 198 230 H58 Q34 230 34 206 V50 Q34 26 58 26 Z M170 26 V58 Q170 78 190 78 H222"/></svg>
      <span>SCAD Workshop</span>
    </a>
    <div id="topsearch" class="topsearch-wrap"></div>
    <a class="engine" id="engine" href="#/licenses" title="Licenses and credits"></a>
    <div id="topbuttons" class="topbuttons"></div>
  </header>

  <div class="app">
  <div id="sidebar-root" class="sidebar-root"></div>
  <div class="app-main">
  <div id="tabs-root"></div>
  <div id="view-browse" class="view-browse" hidden></div>

  <main id="view-model" class="workbench" hidden>
    <aside class="rail" aria-label="Model settings">
      <div class="rail-head" id="model-head"></div>
      <div class="rail-tools">
        <label class="search small">
          <span class="visually-hidden">Find a setting</span>
          <input id="param-search" type="search" placeholder="Find a setting" autocomplete="off">
        </label>
      </div>
      <div id="model-notes-root" class="contents"></div>
      <form id="params" class="params" novalidate></form>
      <div class="actionbar">
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div class="actions">
          <button type="button" id="generate" class="primary">Generate</button>
          <span class="download-pick"><a id="download" class="button secondary is-disabled" aria-disabled="true" href="#" download="model.stl">Download STL</a><select id="download-format" class="format-pick" aria-label="Format" title="The format to download" hidden><option value="stl">STL</option><option value="3mf">3MF</option></select></span>
          <button type="button" id="save-part" class="ghost save-part" hidden title="Keep what you made in the Parts Library, with how it was made">Save as part…</button>
          <button type="button" id="model-collect" class="ghost save-part" hidden title="Add the model, with the settings it has now, to one of your collections">Add to collection…</button>
        </div>
      </div>
    </aside>

    <section class="stage" aria-label="3D preview">
      <canvas id="viewer"></canvas>
      <p class="stage-empty" id="stage-empty" hidden></p>
      <img class="stage-drawing" id="stage-drawing" alt="The model's 2D drawing" hidden>
      <div class="hud-top">
      <div class="hud hud-dims" id="dims" hidden></div>
      <div class="hud hud-tools" role="toolbar" aria-label="View">
        <button type="button" class="hud-more" aria-expanded="false" aria-label="View" title="View buttons">⋯</button>
        <button type="button" data-view="iso" title="Angled view">3D</button>
        <button type="button" data-view="top" title="Top view">Top</button>
        <button type="button" data-view="front" title="Front view">Front</button>
        <button type="button" data-toggle="edges" aria-pressed="false" title="Show edges">Edges</button>
        <button type="button" data-toggle="grid" aria-pressed="true" title="Show 42 mm grid">Grid</button>
      </div>
      </div>
      <div class="hud hud-filament" role="radiogroup" aria-label="Preview colour" id="filament"></div>
      <label class="hud hud-file-colours" id="file-colours-hud" hidden><input type="checkbox" id="file-colours"> Show the file's colours</label>
      <div class="stage-overlay" id="stage-overlay" hidden>
        <div class="progress" aria-hidden="true"><span></span></div>
        <p id="overlay-text"></p>
        <button type="button" class="ghost light" id="cancel">Cancel</button>
      </div>
      <details class="log" id="log" hidden>
        <summary>OpenSCAD output</summary>
        <pre id="log-text"></pre>
      </details>
    </section>
  </main>

  <main id="view-library" class="workbench" hidden>
    <aside class="rail" aria-label="Parts" id="parts-rail"></aside>
  </main>

  <main id="view-about" class="pages" hidden>
    <div class="about">
      <h1 id="about-title">Licenses &amp; credits</h1>
      <div id="about-body"></div>
    </div>
  </main>
  </div>
  <div id="sideview-root" class="sideview-root"></div>
  </div>
  <footer id="statusbar" class="statusbar"></footer>
  <div id="palette-root"></div>
  <div id="quicklook-root"></div>
  <div id="dialog-root"></div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="save-dialog" class="batch save-dialog" aria-labelledby="save-title"></dialog>
  <input type="file" id="settings-import" accept=".json,application/json" hidden>
  <dialog id="batch" class="batch" aria-labelledby="batch-title"></dialog>

  <noscript><p class="noscript">This generator needs JavaScript to build its forms and 3D preview.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
