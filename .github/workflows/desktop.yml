name: Desktop

# Builds the desktop app (Tauri + native OpenSCAD) for Linux and Windows:
# renders every model natively with the app's own render code (workshop-cli),
# drives both apps through WebDriver, runs the library acceptance test, and when
# everything passes on main publishes a numbered release (v0.2.0, v0.2.1, ...;
# see tools/set_version.py). Reports and logs go to the desktop-ci-<os> branches.
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "web/**"
      - "tools/**"
      - "catalog/**"
      - "vendor/**"
      - "adapters/**"
      - "libraries/**"
      - "sources/**"
      - "tests/desktop_ui.py"
      - "tests/desktop_page.py"
      - "tests/tauri_shim.js"
      - "engine.json"
      - "libraries.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  site:
    name: Build site data
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run: { shell: bash }
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Release number
        id: version
        run: |
          v=$(python3 tools/set_version.py --next)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice title=Version::$v"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install tools
        run: |
          pip install numpy playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update -q && sudo apt-get install -yq libopengl0 libegl1 libglx0
      - name: Engines
        run: |
          python tools/fetch_engine.py --out build/engine
          python tools/fetch_native_engine.py --out build/native-dl --extract build/native
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - name: Build workshop-cli
        working-directory: desktop
        run: cargo build --release -p workshop-core
      - name: Verify the test projects' vendored checksums
        run: python tools/validate_sources.py
      - name: Build site (including desktop-only models) and thumbnails
        run: |
          python tools/build_site.py --engine build/engine --out _site --native-engine build/native/squashfs-root/AppRun
          python tools/thumbnails.py --site _site --native-engine build/native/squashfs-root/AppRun
          # the OpenSCAD libraries the app ships with (pinned and hash-checked), indexed into Components by build_desktop.py
          python tools/fetch_libraries.py --out build/desktop/libs
          pip install fonttools   # cuts Layer Line's heading font to the letters the app uses
          python tools/build_desktop.py --site _site --out build/desktop --fetch-fonts
      - name: Pictures of the components (the app's own previews, shipped in libs/thumbs/)
        run: |
          python tools/component_thumbs.py --cli desktop/target/release/workshop-cli --desktop build/desktop \
            --engine build/native/squashfs-root 2>&1 | tee component-thumbs.log
          echo "::notice title=Component pictures::$(tail -1 component-thumbs.log)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-site
          path: build/desktop
          retention-days: 3

  linux:
    name: Linux app
    needs: site
    runs-on: ubuntu-22.04   # oldest supported: the AppImage then runs on newer systems too
    timeout-minutes: 90
    defaults:
      run: { shell: bash }   # -o pipefail, so "cmd | tee log" fails when cmd fails
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: desktop-site, path: build/desktop }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 \
            libopengl0 libegl1 libglx0 xvfb webkit2gtk-driver
          pip install selenium
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - name: Native engine
        run: python tools/fetch_native_engine.py --out build/desktop/engine --extract build/native
      - name: Version ${{ needs.site.outputs.version }}
        run: python tools/set_version.py "${{ needs.site.outputs.version }}"
      - name: Check and test the Rust code
        working-directory: desktop
        run: |
          mkdir -p ../ci-out
          cargo build --release -p workshop-core 2>&1 | tee ../ci-out/core-build.log
          cargo test --release -p workshop-core 2>&1 | tee ../ci-out/core-test.log
          cp Cargo.lock ../ci-out/Cargo.lock
      - name: Render every model natively from the starter library (workshop-cli)
        run: |
          desktop/target/release/workshop-cli bench --app-site build/desktop/site --starter build/desktop/starter \
            --engine build/native/squashfs-root --out ci-out/bench-native-linux.json 2>&1 | tee ci-out/bench-native-linux.log
      - name: Components (every BOSL2 module with geometry renders its first doc example)
        run: |
          desktop/target/release/workshop-cli components-check --libs build/desktop/libs --app-site build/desktop/site \
            --engine build/native/squashfs-root --library BOSL2 --out ci-out/components-bosl2.json 2>&1 | tee ci-out/components-bosl2.log
          # the other libraries: a report (start values are suggested or guessed there, so not every one makes a shape)
          desktop/target/release/workshop-cli components-check --libs build/desktop/libs --app-site build/desktop/site \
            --engine build/native/squashfs-root --out ci-out/components-all.json --no-fail 2>&1 | tail -3 | tee ci-out/components-all.log
          python - <<'EOF'
          import json
          for name in ("bosl2", "all"):
              s = json.load(open(f"ci-out/components-{name}.json"))["summary"]
              print(f"::notice title=Components ({name})::" + "; ".join(f"{k}: {v if isinstance(v, int) else str(v['pass']) + ' made, ' + str(v['fail']) + ' failed'}" for k, v in s.items()))
          EOF
      - name: Build the app (AppImage, deb)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb 2>&1 | tee ../ci-out/tauri-build.log
      - name: Collect bundles
        if: always()
        run: |
          mkdir -p dist
          find desktop/target/release/bundle -maxdepth 2 \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} dist/ \; || true
          ls -la dist | tee -a ci-out/bundles.txt
      - name: The installer has no starter projects (owner, 2026-10-14), but has the component libraries
        run: |
          deb=$(ls dist/*.deb | head -1)
          dpkg -c "$deb" > ci-out/deb-contents.txt
          if grep -q '/starter/' ci-out/deb-contents.txt; then echo "::error title=Installer::the .deb still ships starter/"; exit 1; fi
          grep -q '/libs/' ci-out/deb-contents.txt || { echo "::error title=Installer::the .deb has no libs/"; exit 1; }
          grep -q '/libs/thumbs/bosl2/' ci-out/deb-contents.txt || { echo "::error title=Installer::the .deb has no component pictures"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: bundles-linux, path: dist/, retention-days: 3 }
      - name: Start the app once (startup log)
        if: always()
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          (timeout 25 xvfb-run -a desktop/target/release/scad-workshop > ci-out/app-start.log 2>&1; echo "exit $?" >> ci-out/app-start.log) || true
          ls -la desktop/target/release | head -40 > ci-out/release-dir.txt
          ls -la "$HOME/.local/share" "$HOME/SCAD Workshop" "$HOME/SCAD Workshop/sources" >> ci-out/release-dir.txt 2>&1 || true
      - name: Drive the app (WebDriver)
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          cargo install tauri-driver --locked 2>&1 | tail -3
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          # the installer has no starter projects; the test's projects come from the one built for tests
          export WORKSHOP_STARTER="$PWD/build/desktop/starter"
          # one X server for tauri-driver, WebKitWebDriver and the app it launches
          Xvfb :99 -screen 0 1600x1000x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          sleep 1
          tauri-driver > ci-out/tauri-driver.log 2>&1 &
          sleep 2
          timeout 1200 python tests/desktop_ui.py \
            --app desktop/target/release/scad-workshop --out ci-out/shots 2>&1 | tee ci-out/desktop-ui.log
      - name: Library acceptance test (the page and the app's backend, real GitHub)
        if: always()
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium 2>&1 | tail -2
          timeout 2400 python tests/desktop_page.py --cli desktop/target/release/workshop-cli --ui build/desktop/ui \
            --app-site build/desktop/site --starter build/desktop/starter --engine build/native/squashfs-root \
            --home "$RUNNER_TEMP/p2home" --out ci-out/p2 2>&1 | tee ci-out/desktop-page.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: library-linux
          path: |
            ci-out/p2/library.zip
            ci-out/p2/library-summary.json
          retention-days: 3
      - name: Publish reports to desktop-ci-linux
        if: always()
        run: |
          mkdir -p ci-out && cd ci-out
          echo "${GITHUB_SHA}" > COMMIT
          # GitHub refuses files over 100 MB (the test library's ZIP can be): those stay in the artifacts only
          find . -type f -size +95M -print -delete > LEFT_OUT.txt
          git init -q && git checkout -q -b desktop-ci-linux
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Desktop checks (Linux) for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" desktop-ci-linux

  windows:
    name: Windows app
    needs: site
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: desktop-site, path: build/desktop }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: desktop }
      - name: Native engine
        run: python tools/fetch_native_engine.py --out build/desktop/engine
      - name: Version ${{ needs.site.outputs.version }}
        run: python tools/set_version.py "${{ needs.site.outputs.version }}"
      - name: Check and test the Rust code
        working-directory: desktop
        run: |
          mkdir -p ../ci-out
          cargo build --release -p workshop-core 2>&1 | tee ../ci-out/core-build.log
          cargo test --release -p workshop-core 2>&1 | tee ../ci-out/core-test.log
      - name: Render every model natively from the starter library (workshop-cli)
        run: |
          desktop/target/release/workshop-cli.exe bench --app-site build/desktop/site --starter build/desktop/starter \
            --engine build/desktop/engine --out ci-out/bench-native-windows.json 2>&1 | tee ci-out/bench-native-windows.log
      - name: Components on Windows (a sample from each library)
        run: |
          desktop/target/release/workshop-cli.exe components-check --libs build/desktop/libs --app-site build/desktop/site \
            --engine build/desktop/engine --out ci-out/components-windows.json --timeout 600 \
            bevel_gear spur_gear threaded_rod cuboid knuckle_hinge MetricBolt ScrewThread polyRoundExtrude 2>&1 | tee ci-out/components-windows.log
      - uses: actions/upload-artifact@v4
        with: { name: cli-windows, path: desktop/target/release/workshop-cli.exe, retention-days: 3 }
      - name: Build the app (NSIS installer)
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis 2>&1 | tee ../ci-out/tauri-build.log
      - name: Collect bundles
        if: always()
        run: |
          mkdir -p dist
          cp desktop/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          ls -la dist | tee -a ci-out/bundles.txt
      - uses: actions/upload-artifact@v4
        with: { name: bundles-windows, path: dist/, retention-days: 3 }
      - name: Drive the app (WebDriver)
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          pip install selenium
          cargo install tauri-driver --locked 2>&1 | tail -3
          # the driver must match the WebView2 runtime. msedgedriver-tool fetches it; when it can't be
          # built (a yanked dependency stopped it in 0.4.20), fetch it for WebView2's version, then fall
          # back to the runner's own Edge driver
          { cargo install --locked --git https://github.com/chippers/msedgedriver-tool 2>&1 | tail -3 && msedgedriver-tool 2>&1 | tail -3; } || true
          if [ ! -f msedgedriver.exe ]; then
            wv=$(powershell -NoProfile -Command "(Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv" | tr -d '\r' || true)
            echo "WebView2 $wv"
            for host in msedgedriver.microsoft.com msedgedriver.azureedge.net; do
              [ -n "$wv" ] && curl -fsSL -o edgedriver.zip "https://$host/$wv/edgedriver_win64.zip" && unzip -oq edgedriver.zip msedgedriver.exe && break
            done
          fi
          [ -f msedgedriver.exe ] || cp "$EDGEWEBDRIVER/msedgedriver.exe" .
          ls -la msedgedriver.exe
          # the installer has no starter projects; the test's projects come from the one built for tests
          export WORKSHOP_STARTER="$(cygpath -w "$PWD/build/desktop/starter")"
          tauri-driver --native-driver "$PWD/msedgedriver.exe" > ci-out/tauri-driver.log 2>&1 &
          sleep 3
          timeout 1200 python tests/desktop_ui.py --app desktop/target/release/scad-workshop.exe \
            --out ci-out/shots 2>&1 | tee ci-out/desktop-ui.log
      - name: Publish reports to desktop-ci-windows
        if: always()
        run: |
          mkdir -p ci-out && cd ci-out
          echo "${GITHUB_SHA}" > COMMIT
          # GitHub refuses files over 100 MB (the test library's ZIP can be): those stay in the artifacts only
          find . -type f -size +95M -print -delete > LEFT_OUT.txt
          git init -q && git checkout -q -b desktop-ci-windows
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Desktop checks (Windows) for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" desktop-ci-windows

  portability:
    name: Library made on Linux, opened on Windows
    needs: [linux, windows]
    if: always() && needs.linux.result != 'skipped'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: desktop-site, path: build/desktop }
      - uses: actions/download-artifact@v4
        with: { name: library-linux, path: lin }
      - uses: actions/download-artifact@v4
        with: { name: cli-windows, path: bin }
      - name: Open the Linux library on Windows and compare
        run: |
          mkdir -p "moved/My library" && cd "moved/My library" && unzip -q ../../lin/library.zip && cd ../..
          bin/workshop-cli.exe library-summary --library "moved/My library" --app-site build/desktop/site > win-summary.json
          python - <<'EOF'
          import json, sys
          lin = json.load(open("lin/library-summary.json"))
          win = json.load(open("win-summary.json"))
          if lin == win:
              print(f"::notice title=Portable library::Same on Windows: {len(win['sources'])} projects, {len(win['models'])} models, {win['parts']} parts")
              sys.exit(0)
          for k in lin:
              if lin[k] != win.get(k):
                  print(f"::error title=Portable library::{k} differs: linux {json.dumps(lin[k])[:400]} windows {json.dumps(win.get(k))[:400]}")
          sys.exit(1)
          EOF

  release:
    name: Release
    needs: [site, linux, windows, portability]
    # only from main, and only when every check above passed
    if: github.ref == 'refs/heads/main' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.portability.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # tags and history, for "what changed"
      - uses: actions/download-artifact@v4
        with: { pattern: bundles-*, path: dist, merge-multiple: true }
      - name: Publish v${{ needs.site.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.site.outputs.version }}
        run: |
          ls -la dist
          prev=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          {
            echo "**Windows:** the \`-setup.exe\` (unsigned, so SmartScreen asks once: More info → Run anyway)."
            echo "**Linux:** the \`.deb\` or the \`.AppImage\`."
            echo
            if [ -n "$prev" ]; then
              echo "### Changes since $prev"
              git log --no-merges --format='- %s' "$prev..$GITHUB_SHA"
            else
              echo "First numbered release of this series."
            fi
          } > notes.md
          gh release create "v$V" dist/* --title "SCAD Workshop $V" --notes-file notes.md --target "$GITHUB_SHA" --latest
          # the unnumbered rolling build this replaces
          gh release delete desktop-latest --cleanup-tag --yes 2>/dev/null || true
          echo "::notice title=Released::SCAD Workshop $V"
